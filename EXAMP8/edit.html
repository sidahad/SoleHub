<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul>
        <li>
            <a href="contactus.html">ADD DATA</a>
        </li>
        <li>
            <a href="fetch.html">VIEW DATA</a>
        </li>
    </ul>

    <form method="post" id="studentsForm">
        <label for="">Name
            <input type="text" id="name">
        </label> <br>
        <label for="">Email
            <input type="email" id="email">
        </label> <br>
        <label for="">Phone
            <input type="number" id="phone">
        </label> <br>
        <label for="">Message
            <input type="text" id="message">
        </label> <br>

        <button type="submit">Update</button>
    </form>
    
</body>
<script>
    let id = localStorage.getItem("id");

    fetch(`http://localhost:3000/students/${id}`)
    .then((response) => {
        return response.json()
    })
    .then((data) => {

        document.getElementById("name").value = data.name;
        document.getElementById("email").value = data.email;
        document.getElementById("phone").value = data.phone;
        document.getElementById("message").value = data.message;
    })

    let studForm = document.getElementById("studentsForm");

    studForm.onsubmit = (e) => {
        e.preventDefault();

        let data = {
        "name":document.getElementById("name").value,
        "email":document.getElementById("email").value,
        "phone": document.getElementById("phone").value,
        "message":document.getElementById("message").value,
    }

    console.log(data)

    let jsonData = JSON.stringify(data)

    fetch(`http://localhost:3000/students/${id}`, {
        method: "PUT",
        headers: {
            'Content-Type': 'application/json'
        },
        body: jsonData
    })
    .then((response) =>{
        let jsResponse = response.json()

        return jsResponse
    })
    .then((data) => {

        console.log(data);

        window.location.href = 'fetch.html'

        alert("Data Updated Sucessfully")
    })
    }
</script>
</html>
