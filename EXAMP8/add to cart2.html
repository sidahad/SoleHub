<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoe Store</title>
    <style>
        .card {
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 20px;
            margin: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .card img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
        }

        .card:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="card" onclick="addToCart('Shoe 1', 'img/bata-pagination1.png', 50)">
        <img src="img/bata-pagination1.png" height="50px" width="50px" alt="Shoe 1">
        <p>Shoe 1</p>
        <p>Price: $50</p>
    </div>
    <div class="card" onclick="addToCart('Shoe 2', 'img/bata-pagination-page2-2.png', 60)">
        <img src="img/bata-pagination-page2-2.png" height="50px" width="50px" alt="Shoe 2">
        <p>Shoe 2</p>
        <p>Price: $60</p>
    </div>
    <div class="card" onclick="addToCart('Shoe 3', 'img/bata-pagination-page2-3.png', 70)">
        <img src="img/bata-pagination-page2-3.png" height="50px" width="50px" alt="Shoe 3">
        <p>Shoe 3</p>
        <p>Price: $70</p>
    </div>
    <div class="card" onclick="addToCart('Shoe 4', 'img/bata-pagination1.png', 80)">
        <img src="img/bata-pagination1.png" height="50px" width="50px" alt="Shoe 4">
        <p>Shoe 4</p>
        <p>Price: $80</p>
    </div>
    <div class="card" onclick="addToCart('Shoe 5', 'img/bata-pagination-page2-7.png', 90)">
        <img src="img/bata-pagination-page2-7.png" height="50px" width="50px" alt="Shoe 5">
        <p>Shoe 5</p>
        <p>Price: $90</p>
    </div>
    <div class="card" onclick="addToCart('Shoe 6', 'img/bata-pagination-page2-9.png', 100)">
        <img src="img/bata-pagination-page2-9.png" height="50px" width="50px" alt="Shoe 6">
        <p>Shoe 6</p>
        <p>Price: $100</p>
    </div>

    <script>
        function addToCart(item, image, price) {
            let cartItems = JSON.parse(localStorage.getItem('cartItems')) || [];
            cartItems.push({ name: item, image: image, price: price });
            localStorage.setItem('cartItems', JSON.stringify(cartItems));
            window.location.href = "/cart.html";  // Redirect to cart page
        }
    </script>
</body>
</html>
