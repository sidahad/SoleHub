<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul>
        <li>
            <a href="index.html">ADD STUDENT</a>
        </li>
        <li>
            <a href="fetch.html">VIEW STUDENTS</a>
        </li>
    </ul>

    <table id="studentsTable" border="1" width="100%">
    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Email</th>
        <th>Phone</th>
        <th colspan="2">Action</th>
    </tr>
    </table>
</body>

<script>
    fetch('http://localhost:3000/students')
    .then((response) => {
        return response.json()
    })
    .then((data) => {
        let studentsTable = document.getElementById("studentsTable")

        for (let i in data) {
            studentsTable.innerHTML += `<tr>
                <td>${data[i].name}</td>
                <td>${data[i].age}</td>
                <td>${data[i].email}</td>
                <td>${data[i].phone}</td>
                <td>
                    <button onclick="editStudent(${data[i].id})">EDIT</button>
                </td>
                <td>
                    <button onclick="deleteStudent(${data[i].id})">DELETE</button>
                </td>
            </tr>`
        }
    })

    function deleteStudent(id) {
        fetch(`http://localhost:3000/students/${id}`,
        {
            method: "DELETE",
            headers: {
                "Content-Type": 'application/json'
            }
        })

        .then((response) => {

            let jsResponse = response.json()

            return jsResponce
        })

        .then((data) => {

            console.log(data);

            window.location.reload();

        })
    }

    function editStudent(id){

        localStorage.setItem('id', id);

        window.location.href = 'edit.html'

    }
    
</script>
</html>
